services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/supabase/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - postgres

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  postgres_data:
